<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>Sheet Music Store | Parakeet Press</title>
  <link rel="stylesheet" href="style.css?v=2.2">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo-link">
        <img src="pp_files/PP_Logo_Original.png" alt="Parakeet Press Logo" class="logo-img">
        <span class="logo-text">Parakeet Press</span>
      </a>
      <nav>
        <ul class="nav-menu">
          <li><a href="index.html" class="nav-link">Home</a></li>
          <li><a href="services.html" class="nav-link">Services</a></li>
          <li><a href="store.html" class="nav-link active">Store</a></li>
          <li><a href="chirp.html" class="nav-link">Chirp!</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section id="store">
      <h2>Sheet Music Catalog</h2>
      <div class="store-redownload-banner" style="text-align:center;margin:-0.6rem auto 1.8rem auto;font-size:0.95rem;color:var(--text-secondary);">
        Need to re-download a previous purchase? <a href="downloads.html" style="color:var(--primary-dark);font-weight:600;text-decoration:underline;">Click here to retrieve your scores &rarr;</a>
      </div>

      <div class="store-toolbar">
        <input id="store-search" class="store-search-input" type="text" placeholder="Search by title, instrument, year...">
        <select id="type-filter" class="store-filter-select">
          <option value="all">All Categories</option>
          <option value="originals">Original Works</option>
          <option value="arrangements">Arrangements</option>
        </select>
        <select id="inst-filter" class="store-filter-select">
          <option value="all">All Instruments</option>
        </select>
      </div>

      <div id="pagination-controls-top" class="pagination-controls pagination-top"></div>

      <div id="store-cards" class="store-cards"></div>

      <div id="pagination-controls-bottom" class="pagination-controls pagination-bottom"></div>
    </section>
  </main>

  <footer>
    <p id="copyright"></p>
  </footer>

  <script>
    document.addEventListener('DOMContentLoaded', function() {
      var year = new Date().getFullYear();
      var copyright = document.getElementById('copyright');
      if (copyright) {
        copyright.innerHTML = `&copy; ${year} Parakeet Press. All rights reserved.`;
      }
    });

    // Robust CSV parser for quoted fields
    function parseCSV(text) {
      const lines = text.trim().split('\n');
      const headers = lines[0].split(',');
      return lines.slice(1).map(line => {
        const values = [];
        let current = '';
        let inQuotes = false;
        for (let i = 0; i < line.length; i++) {
          const char = line[i];
          if (char === '"') {
            inQuotes = !inQuotes;
          } else if (char === ',' && !inQuotes) {
            values.push(current);
            current = '';
          } else {
            current += char;
          }
        }
        values.push(current);
        const obj = {};
        headers.forEach((h, i) => obj[h.trim()] = values[i] ? values[i].trim() : '');
        return obj;
      });
    }

    let allProducts = [];
    let currentPage = parseInt(new URLSearchParams(window.location.search).get('page')) || 1;
    const pageSize = 18;
    let lastFilteredProducts = [];

    function getFilteredProducts() {
      const q = (document.getElementById('store-search')?.value || '').trim().toLowerCase();
      const type = (document.getElementById('type-filter')?.value || 'all');
      const inst = (document.getElementById('inst-filter')?.value || 'all');
      return allProducts.filter(p => {
        if (q) {
          const matches = (p.title && p.title.toLowerCase().includes(q)) ||
                          (p.instrumentation && p.instrumentation.toLowerCase().includes(q)) ||
                          (p.year && p.year.toLowerCase().includes(q));
          if (!matches) return false;
        }
        const notes = (p.priceNotes || '').toLowerCase();
        if (type === 'originals') {
          if (!notes.includes('original')) return false;
        } else if (type === 'arrangements') {
          if (!(notes.includes('copyright') || notes.includes('public domain'))) return false;
        }
        if (inst !== 'all') {
          const instr = (p.instrumentation || '').trim();
          if (instr !== inst) return false;
        }
        return true;
      });
    }

    function populateInstrumentationFilter(products) {
      const counts = {};
      products.forEach(p => {
        const k = (p.instrumentation || '').trim();
        if (!k || k.toLowerCase() === 'n/a') return;
        counts[k] = (counts[k] || 0) + 1;
      });
      const instSelect = document.getElementById('inst-filter');
      if (!instSelect) return;
      instSelect.innerHTML = '<option value="all">All Instruments</option>';
      Object.keys(counts).sort((a,b) => a.localeCompare(b)).forEach(k => {
        const opt = document.createElement('option');
        opt.value = k;
        opt.textContent = `${k} (${counts[k]})`;
        instSelect.appendChild(opt);
      });
    }

    function updateAndRender(page) {
      if (typeof page === 'number') currentPage = page;
      if (!currentPage || currentPage < 1) currentPage = 1;
      const filtered = getFilteredProducts();
      lastFilteredProducts = filtered;
      renderStore(filtered, currentPage);
    }

    function renderStore(products, page = 1) {
      const container = document.getElementById('store-cards');
      const totalPages = Math.max(1, Math.ceil(products.length / pageSize));
      if (page < 1) page = 1;
      if (page > totalPages) page = totalPages;
      currentPage = page;
      const startIdx = (page - 1) * pageSize;
      const endIdx = startIdx + pageSize;
      const pageProducts = products.slice(startIdx, endIdx);

      if (pageProducts.length === 0) {
        container.innerHTML = '<div style="grid-column: 1 / -1; text-align:center; padding: 3rem; color: var(--text-muted); font-size: 1.1rem;">No scores found matching your criteria.</div>';
        renderPagination(0, 1);
        return;
      }

      container.innerHTML = pageProducts.map((p) => {
        const safeTitle = (p.title || '').trim();
        const escapedTitle = safeTitle.replace(/"/g, '&quot;').replace(/'/g, '&#39;');
        const imgJpg = `pp_files/pp_store/pp_cover-imgs/${safeTitle}.jpg`;
        const imgJpeg = `pp_files/pp_store/pp_cover-imgs/${safeTitle}.jpeg`;
        const imgTag = `<img src="${imgJpg}" alt="${escapedTitle} cover" class="cover-img" loading="lazy" onerror="this.onerror=null;this.src='${imgJpeg}';this.onerror=function(){this.parentElement.innerHTML='<div class=\\'cover-placeholder\\'><i class=\\'fas fa-music\\'></i><span>${escapedTitle}</span></div>';};">`;

        let priceText = 'View Details';
        if (p.price && p.price.trim()) {
          const num = parseFloat(p.price.replace(/[^\d.]/g, ''));
          if (isFinite(num) && num > 0) {
            priceText = `Buy &bull; $${num.toFixed(2)}`;
          }
        }

        return `
          <div class="product-card" data-id="${encodeURIComponent(p.id)}" tabindex="0">
            <div class="cover-img-frame">
              ${imgTag}
            </div>
            <h3>${p.title}</h3>
            <div class="product-meta">
              <span class="product-instrumentation">${p.instrumentation || 'Ensemble'}</span>
              ${p.duration ? `<span class="product-duration">${p.duration} min.</span>` : ''}
            </div>
            <button class="buy-btn" data-id="${encodeURIComponent(p.id)}" tabindex="-1">
              ${priceText}
            </button>
          </div>
        `;
      }).join('');

      renderPagination(products.length, page);

      try {
        const params = new URLSearchParams(window.location.search);
        if (page > 1) {
          params.set('page', String(page));
        } else {
          params.delete('page');
        }
        const qs = params.toString();
        const newUrl = qs ? `${window.location.pathname}?${qs}` : window.location.pathname;
        window.history.replaceState({}, '', newUrl);
      } catch (e) {}
    }

    function getPaginationRange(current, total) {
      if (total <= 7) {
        return Array.from({ length: total }, (_, i) => i + 1);
      }
      if (current <= 4) {
        return [1, 2, 3, 4, 5, '...', total];
      }
      if (current >= total - 3) {
        return [1, '...', total - 4, total - 3, total - 2, total - 1, total];
      }
      return [1, '...', current - 1, current, current + 1, '...', total];
    }

    function renderPagination(totalItems, page) {
      const topControls = document.getElementById('pagination-controls-top');
      const bottomControls = document.getElementById('pagination-controls-bottom');
      const totalPages = Math.ceil(totalItems / pageSize);

      if (totalPages <= 1) {
        if (topControls) topControls.innerHTML = '';
        if (bottomControls) bottomControls.innerHTML = '';
        return;
      }

      const range = getPaginationRange(page, totalPages);
      let numbersHtml = '';
      range.forEach(item => {
        if (item === '...') {
          numbersHtml += `<span class="pagination-ellipsis" aria-hidden="true">&hellip;</span>`;
        } else {
          const isActive = item === page;
          numbersHtml += `<button type="button" class="pagination-btn pagination-num ${isActive ? 'active' : ''}" data-page="${item}" aria-label="Page ${item}" ${isActive ? 'aria-current="page"' : ''}>${item}</button>`;
        }
      });

      const html = `
        <button type="button" class="pagination-btn pagination-nav" data-page="1" ${page <= 1 ? 'disabled' : ''} title="First Page (<<-)" aria-label="First Page">&laquo;&minus;</button>
        <button type="button" class="pagination-btn pagination-nav" data-page="${page - 1}" ${page <= 1 ? 'disabled' : ''} title="Previous Page (<-)" aria-label="Previous Page">&larr;</button>
        ${numbersHtml}
        <button type="button" class="pagination-btn pagination-nav" data-page="${page + 1}" ${page >= totalPages ? 'disabled' : ''} title="Next Page (->)" aria-label="Next Page">&rarr;</button>
        <button type="button" class="pagination-btn pagination-nav" data-page="${totalPages}" ${page >= totalPages ? 'disabled' : ''} title="Last Page (->>)" aria-label="Last Page">&minus;&raquo;</button>
      `;

      if (topControls) topControls.innerHTML = html;
      if (bottomControls) bottomControls.innerHTML = html;
    }

    function handlePaginationClick(e, isBottom) {
      const btn = e.target.closest('.pagination-btn');
      if (!btn || btn.disabled || btn.classList.contains('active')) return;
      const targetPage = parseInt(btn.getAttribute('data-page'), 10);
      if (targetPage && !isNaN(targetPage) && targetPage !== currentPage) {
        updateAndRender(targetPage);
        if (isBottom) {
          const storeSection = document.getElementById('store');
          if (storeSection) {
            storeSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
          } else {
            window.scrollTo({ top: 0, behavior: 'smooth' });
          }
        }
      }
    }

    const topPaginationEl = document.getElementById('pagination-controls-top');
    const bottomPaginationEl = document.getElementById('pagination-controls-bottom');
    if (topPaginationEl) topPaginationEl.addEventListener('click', (e) => handlePaginationClick(e, false));
    if (bottomPaginationEl) bottomPaginationEl.addEventListener('click', (e) => handlePaginationClick(e, true));

    fetch('pp_files/pp_store/scoresShop.csv')
      .then(res => res.text())
      .then(text => {
        allProducts = parseCSV(text);
        allProducts = allProducts.reverse();
        populateInstrumentationFilter(allProducts);
        updateAndRender(currentPage);
      });

    document.getElementById('store-search').addEventListener('input', function() {
      updateAndRender(1);
    });
    document.getElementById('type-filter').addEventListener('change', function() {
      updateAndRender(1);
    });
    document.getElementById('inst-filter').addEventListener('change', function() {
      updateAndRender(1);
    });

    document.addEventListener('click', function(e) {
      const card = e.target.closest('.product-card');
      if (card) {
        const encodedId = card.getAttribute('data-id');
        if (encodedId) {
          window.location.href = 'product-details.html?id=' + encodedId + '&page=' + encodeURIComponent(currentPage);
        }
      }
    });

    document.addEventListener('keydown', function(e) {
      if ((e.key === 'Enter' || e.key === ' ') && document.activeElement.classList.contains('product-card')) {
        const encodedId = document.activeElement.getAttribute('data-id');
        if (encodedId) {
          window.location.href = 'product-details.html?id=' + encodedId + '&page=' + encodeURIComponent(currentPage);
        }
      }
    });
  </script>
</body>
</html>
